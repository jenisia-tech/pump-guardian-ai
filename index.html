<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="CentriGuard — a software digital twin that analyzes simulated vibration and temperature data to predict failures in the centrifugal pumps of HVAC systems. Browse the catalog, build your fleet, and monitor pump health." />
  <title>CentriGuard · Centrifugal Pump Analytics</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme") || "dark";
        var d = document.documentElement;
        if (t === "dark") d.classList.add("dark");
        else d.classList.remove("dark");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
